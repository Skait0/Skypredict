name: Record full-time results

# The live feed only holds matches that are in play - a game is there while it
# is on and gone shortly after - so catching every result means looking often,
# not once. Vercel's Hobby plan allows one cron run a day, which is nowhere
# near enough, so the schedule lives here instead. GitHub Actions is free for
# this and the repo is already on GitHub.
#
# Every 10 minutes, around the clock.
#
# It used to run 10:00-23:59 UTC, described as "the football day". That is the
# European football day. We publish 81 fixtures across MLS, Liga MX, Brazil
# Serie A and the Argentine leagues, and 66 of them kick off between 22:00 and
# 10:00 UTC - so the sweep was asleep for the whole of the Americas.
#
# The effect was not that those matches went unrecorded, which would be
# survivable. It was worse: the last poll at 23:50 saw them in the first half,
# the window then closed, and by the next run at 10:00 they were long gone from
# the feed and last seen at around the 45th minute. That is below the 80th
# minute the sweep requires, so every one of them was discarded as a match that
# had vanished mid-game rather than finished. A fifth of the card could never
# reach the record by construction.
#
# The repository is public, so scheduled runs cost nothing and there is no
# reason to buy coverage back with a narrower window.
#
# The interval is not arbitrary. A match is recorded at the last score seen
# before it left the feed, so the gap between polls is the window in which a
# late goal can be missed. Ten minutes keeps that tight enough that the last
# observation is usually past the 80th minute, which is what the sweep requires
# before it will treat a score as final. At thirty minutes most matches were
# last seen too early to qualify and would simply go unrecorded.
#
# GitHub can delay scheduled runs under load, which costs coverage but never
# correctness - a late poll means a match is missed, not mis-scored.
#
# Needs two repository secrets:
#   SWEEP_URL  https://skypredict-theta.vercel.app/api/record-sweep
#   REBUILD_HOOK  a Vercel deploy hook (Project > Settings > Git > Deploy Hooks).
#     Optional: without it the sweep still records everything and the results
#     appear at the next daily build. With it they appear within minutes.
#   SWEEP_KEY  the same value as the SWEEP_KEY environment variable on Vercel

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Grade but do not write"
        type: boolean
        default: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sweep
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
          SWEEP_KEY: ${{ secrets.SWEEP_KEY }}
          DRY: ${{ inputs.dry && '?dry=1' || '' }}
        run: |
          if [ -z "$SWEEP_URL" ] || [ -z "$SWEEP_KEY" ]; then
            echo "SWEEP_URL or SWEEP_KEY is not set - add them under repository secrets."
            exit 1
          fi
          # -f would hide the body on a non-2xx, and the body is the diagnosis.
          code=$(curl -sS -o response.json -w '%{http_code}' \
                  -H "x-sweep-key: $SWEEP_KEY" \
                  --max-time 60 \
                  "$SWEEP_URL$DRY")
          echo "HTTP $code"
          cat response.json
          echo
          # A bad run should be visible in the Actions tab rather than silently
          # green, but a single failure is not worth an alarm - the next run is
          # ten minutes away and the work is idempotent.
          test "$code" = "200"

      # Publishing what the sweep just banked.
      #
      # A finalised result goes into Supabase within about twenty minutes of full
      # time, but it only reaches the site during a BUILD - lib/build.js merges
      # Supabase rows into the payload, and public/predictions.json is written by
      # prebuild at deploy. The only scheduled build is Vercel's daily cron at
      # 06:30 UTC (one run a day is the Hobby plan limit), so a match finishing
      # at nine in the evening sat in the database until the following morning.
      #
      # This fires a Vercel deploy hook, and only when there is something to
      # publish: most runs finalise nothing, and rebuilding the whole site every
      # ten minutes to change nothing would be wasteful and would churn every CDN
      # cache for no reason.
      - name: Publish, if anything was finalised
        if: ${{ !inputs.dry }}
        env:
          REBUILD_HOOK: ${{ secrets.REBUILD_HOOK }}
        run: |
          n=$(jq -r '.finalised // 0' response.json 2>/dev/null || echo 0)
          echo "finalised this run: $n"
          if [ "$n" = "0" ] || [ "$n" = "null" ]; then
            echo "nothing new - leaving the site as it is"
            exit 0
          fi
          if [ -z "$REBUILD_HOOK" ]; then
            echo "REBUILD_HOOK is not set, so these results will appear at the"
            echo "next daily build instead of within a few minutes."
            exit 0
          fi
          code=$(curl -sS -X POST -o hook.json -w '%{http_code}' \
                  --max-time 30 "$REBUILD_HOOK")
          echo "deploy hook: HTTP $code"
          cat hook.json 2>/dev/null || true
          echo
          # Worth going red for. The results are safe in Supabase either way, but
          # a hook that has quietly stopped working means every result waits for
          # the morning again, and that is the thing this step exists to prevent.
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
