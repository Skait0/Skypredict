name: Can each bookmaker still take a slip

# A two-leg slip booked on every book, every morning, and read back.
#
# WHY A CANARY AND NOT A TEST. Every failure this integration has had was
# silent. A datacentre block page arrives as HTTP 200 with an empty list. A
# bookmaker accepts a selection id it does not recognise and hands back a
# perfectly ordinary booking code containing nothing. An id field changes under
# us and every booking keeps reporting success. None of it errors, so the first
# thing that notices is a reader whose code opens an empty betslip - and the
# first thing we hear is a complaint, days later.
#
# The unit suites prove the logic. Only this proves the wire: our edge, the
# proxy, Railway, the bookmaker, and the mapping in between, on real fixtures.
#
# IT HAS NO SCHEDULE OF ITS OWN, ON PURPOSE. It used to ask for 05:30 UTC, half
# an hour before the daily code is minted, and in the fourteen hours that cron
# existed GitHub fired it zero times. That is not a misconfiguration: scheduled
# runs on a free-tier repository are dropped silently under load, and this repo
# drops most of them - record-sweep.yml asks for every ten minutes and lands
# about five times a day. A canary whose own trigger is unreliable reports
# green by being absent, which is the exact shape of failure it was written to
# catch.
#
# So daily-code.yml calls it. That workflow's schedule does fire - which is the
# whole difference - and the code it mints is the thing that would be wrong if
# a mapping had rotted, so the canary now rides the trigger it exists to
# protect.
#
# IT FIRES LATE, AND THAT IS WORTH KNOWING RATHER THAN PRETENDING. daily-code
# asks for 06:00 UTC and lands between 10:19 and 12:12, measured across the
# week to 15 Sep. So this runs at midday rather than at dawn, and the books are
# checked after the day's code is minted rather than before. That is still the
# right trade: a check that happens four hours late tells you the wire broke,
# and one scheduled for 05:30 that never fires tells you nothing at all. See
# daily-code.yml for why the cron is not being tuned to cancel the delay out.
#
# IT DOES NOT GATE THE MINT. It is a sibling job, not a step in front of one,
# and a red canary does not stop a code being published. mkcode.js already
# handles a book being down better than a blanket refusal would: it publishes
# the other book's code and says which is missing, which was written after a
# day with nothing on the page because Bet9ja's origin blipped for a minute.
# This says the wire broke. It does not decide what to do about it.
#
# COST. Two selections per book per day. api/book.js is explicit about what a
# booking call costs - Railway CPU on a $5 plan and bookmaker goodwill already
# spent once - which is why this is two legs rather than five, and daily rather
# than hourly.
#
# Needs no secrets: it books through the public route the site itself uses.

on:
  # Called by daily-code.yml. No inputs: the defaults are what the morning run
  # wants - every book, really booked.
  workflow_call:
  workflow_dispatch:
    inputs:
      books:
        description: "Which books (comma separated). Blank means all."
        type: string
        default: ""
      dry:
        description: "Check the feeds without booking anything"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Exits non-zero if any book fails, so the run goes red and GitHub mails
      # it. A canary nobody is told about is a log line.
      - name: Book and read back
        run: |
          node scripts/canary.js \
            ${{ inputs.books && format('--books={0}', inputs.books) || '' }} \
            ${{ inputs.dry && '--dry' || '' }}
