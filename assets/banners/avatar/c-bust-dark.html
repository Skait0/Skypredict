<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar C — bust on dark</title>
<style>
  /* 400x400 X avatar. The existing app icon whole, with the white ground
     swapped for the brand's. The most conservative option: it is the mark the
     installed app already uses, so a reader who has the site on their home
     screen sees the same picture in both places.
     Its weakness is the one this option cannot fix - the whole bust is a lot
     of detail for 32px, and the header already shows a wizard's face. */
  *{margin:0;padding:0}
  .a{width:400px;height:400px;position:relative;overflow:hidden;background:#0D0D0F}
  .art{position:absolute;inset:0;
    background-image:url('../../../public/app-icon.png');
    background-repeat:no-repeat;background-size:112%;background-position:50% 46%}
  .vig{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 46%, rgba(13,13,15,0) 52%, rgba(13,13,15,.5) 78%, #0D0D0F 100%)}
</style>
</head>
<body>
  <div class="a"><div class="art"></div><div class="vig"></div></div>
</body>
</html>
