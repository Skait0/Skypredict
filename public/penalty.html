<style>
/* PENALTY WAHALA - wizardry x soccer, the site's own tokens. Gold is for wins
   and small accents only; red is the brand and the action. */
:root{--bg:#0D0D0F;--card:#16161A;--card2:#1D1D22;--line:#2A2A30;--text:#F3F3F5;--soft:#A3A3AD;--faint:#6E6E78;--red:#E63946;--gold:#F2B84B;--green:#2FD48A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:600 15px/1.35 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#07080a}
#world{position:absolute;inset:0;will-change:transform}
/* night sky, two floodlight cones, a crowd that only twinkles when it has a reason */
.sky{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,#1a1c24 0%,#0b0c10 55%,#07080a 100%)}
.beam{position:absolute;top:-10%;width:70%;height:75%;opacity:.07;background:linear-gradient(180deg,#fff,transparent 80%);filter:blur(6px);transition:opacity .25s}
.beam.l{left:-25%;transform:skewX(28deg)}.beam.r{right:-25%;transform:skewX(-28deg)}
.flashing .beam{opacity:.22}
/* the stand: tiers that fade into the dark, heads at three sizes so no grid shows */
.crowd{position:absolute;left:0;right:0;background:
  linear-gradient(180deg,#07080a 0%,#07080ae6 30%,#07080a59 75%,#07080a1a 100%),
  repeating-linear-gradient(180deg,transparent 0 21px,#0000004d 21px 23px),
  radial-gradient(circle at 5px 6px,#1c1d23 4px,transparent 5px) 0 0/13px 11px,
  radial-gradient(circle at 9px 4px,#17181d 5px,transparent 6px) 3px 5px/17px 12px,
  radial-gradient(circle at 6px 8px,#202128 3px,transparent 4px) 7px 2px/11px 13px,#0c0d11}
.crowd i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0}
.hype .crowd i{animation:pw-twinkle .5s steps(2) 3}
/* LED boards behind the goal */
.boards{position:absolute;left:0;right:0;background:#050506;border-top:1px solid #2a2a30;border-bottom:1px solid #2a2a30;overflow:hidden}
.boards:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff0d,transparent 40%),repeating-linear-gradient(90deg,transparent 0 2px,#05050666 2px 3px);pointer-events:none}
.track{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;animation:pw-marquee 22s linear infinite;will-change:transform}
.track span{font:italic 800 var(--bf,14px)/1 "Roboto Condensed",Impact,sans-serif;letter-spacing:.08em;color:var(--red);text-shadow:0 0 6px #e6394699;padding-right:2.2em}
.track span b{color:#fff;font-weight:800;text-shadow:0 0 6px #ffffff66}
.bflash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 800 var(--bf,14px)/1 "Roboto Condensed",Impact,sans-serif;letter-spacing:.3em;opacity:0;background:#050506}
.bflash.go{animation:pw-blink .9s steps(1) 1}
/* pitch */
.grass{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(180deg,#17502d 0 var(--st,28px),#13442a var(--st,28px) calc(var(--st,28px)*2))}
.grass:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07080a99,transparent 30%),radial-gradient(120% 80% at 50% 70%,transparent 50%,#07080a99 100%)}
svg.layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sprite{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;pointer-events:none;-webkit-user-drag:none}
#shooter{transform-origin:50% 100%}
#shadow{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,#000a,transparent);will-change:transform,opacity}
#ball{z-index:3}
.zones{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;opacity:0;pointer-events:none;transition:opacity .2s}
.zones.on{opacity:1;pointer-events:auto}
.zones button{border:0;margin:2px;border-radius:10px;background:#ffffff08;outline:1px dashed #ffffff30;cursor:pointer;touch-action:manipulation}
.zones button:active{background:#e6394633}
#reticle{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px dashed var(--red);box-shadow:0 0 12px #e6394688,inset 0 0 8px #e6394666;opacity:0;pointer-events:none}
#reticle.on{opacity:1;animation:pw-spin 2.2s linear infinite}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) 14px 0;z-index:6;pointer-events:none}
.score{display:flex;align-items:center;gap:10px;background:#0d0d0fcc;border:1px solid var(--line);border-radius:99px;padding:7px 14px;backdrop-filter:blur(6px)}
.score b{font:italic 800 18px/1 "Roboto Condensed",sans-serif;min-width:14px;text-align:center}
.score .who{font-size:12px;color:var(--soft);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:#2a2a30;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.dots i.g{background:var(--green);transform:scale(1.15)}.dots i.m{background:var(--red)}
#tag{position:absolute;top:calc(56px + env(safe-area-inset-top));left:0;right:0;text-align:center;font:italic 800 13px/1 "Roboto Condensed",sans-serif;letter-spacing:.2em;color:var(--soft);z-index:6;pointer-events:none}
/* power bar: weak / green / over, with the sweet spot marked in gold */
#bar{position:absolute;left:14%;right:14%;bottom:calc(9% + env(safe-area-inset-bottom));height:12px;border-radius:99px;background:linear-gradient(90deg,#34343c 0 55%,#1f7a4e 55% 72%,var(--green) 72% 82%,#1f7a4e 82% 88%,var(--red) 88%);box-shadow:0 0 0 1px #ffffff1a,0 6px 20px #0008;opacity:0;transform:translateY(10px);transition:opacity .18s,transform .18s;z-index:5}
#bar.on{opacity:1;transform:none}
#bar:before{content:"";position:absolute;left:72%;width:10%;top:-3px;bottom:-3px;border-radius:4px;border:1px solid var(--gold);opacity:.8}
#knob{position:absolute;top:-6px;left:0;width:6px;height:24px;margin-left:-3px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff,0 0 2px #000;will-change:transform}
#hint{position:absolute;left:0;right:0;bottom:calc(14% + env(safe-area-inset-bottom));text-align:center;font:italic 800 15px/1 "Roboto Condensed",sans-serif;letter-spacing:.18em;color:#fff;opacity:0;transition:opacity .2s;z-index:5;pointer-events:none;text-shadow:0 2px 8px #000}
#hint.on{opacity:1}#hint i{display:block;font-style:normal;animation:pw-nudge .9s ease-in-out infinite}
/* pop words */
#pop{position:absolute;left:0;right:0;top:46%;text-align:center;font:italic 800 54px/1 "Roboto Condensed",Impact,sans-serif;letter-spacing:-.01em;opacity:0;pointer-events:none;z-index:7;-webkit-text-stroke:2px #07080a;paint-order:stroke fill;text-shadow:0 6px 24px #000c}
#pop.go{animation:pw-pop .95s cubic-bezier(.2,.9,.25,1)}
#combo{position:absolute;right:0;left:0;text-align:center;top:calc(80px + env(safe-area-inset-top));font:italic 800 14px/1 "Roboto Condensed",sans-serif;color:var(--gold);letter-spacing:.1em;opacity:0;z-index:6}
#combo.on{opacity:1;animation:pw-flame .8s ease-in-out infinite alternate}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
/* bottom sheet (menus, results) */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1);z-index:9;max-height:85%;overflow:auto;box-shadow:0 -20px 50px #000a}
#sheet.on{transform:none}
#sheet h2{margin:2px 0 6px;font:italic 800 26px/1.05 "Roboto Condensed",sans-serif;letter-spacing:.01em}
#sheet p{margin:0 0 12px;color:var(--soft);font-size:14px}
#sheet .note{color:var(--gold);font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:8px;border:0;border-radius:999px;font:800 15px "Plus Jakarta Sans",system-ui;cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 8px 24px #e6394644}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.row{display:flex;gap:8px}.row .btn{flex:1}
input.name{width:100%;height:50px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 18px;font:inherit;font-size:16px;margin-bottom:4px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.pick button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 9px;border-radius:16px;border:1px solid var(--line);background:var(--card2);color:var(--soft);font:italic 800 14px/1 "Roboto Condensed",sans-serif;letter-spacing:.12em;cursor:pointer;transition:transform .15s,border-color .15s}
.pick button img{height:86px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.pick button.on{border-color:var(--red);color:var(--text);box-shadow:0 0 0 1px var(--red),0 10px 26px #e6394633}
.pick button.on img{transform:scale(1.08) translateY(-2px)}
.tips{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card2)}
.tips:empty{display:none}.tips p{margin:0 0 4px!important}.tips b{display:block;font-size:16px;margin-bottom:2px}
@keyframes pw-marquee{to{transform:translateX(-50%)}}
@keyframes pw-blink{0%{opacity:1}20%{opacity:0}35%{opacity:1}55%{opacity:0}70%{opacity:1}100%{opacity:0}}
@keyframes pw-twinkle{0%{opacity:0}50%{opacity:.9}}
@keyframes pw-spin{to{transform:rotate(1turn)}}
@keyframes pw-nudge{50%{transform:translateY(-6px)}}
@keyframes pw-pop{0%{opacity:0;transform:scale(.3) skewX(-8deg)}22%{opacity:1;transform:scale(1.18) skewX(-8deg)}40%{transform:scale(.96) skewX(-8deg)}55%{opacity:1;transform:scale(1) skewX(-8deg)}100%{opacity:0;transform:scale(1.06) translateY(-14px) skewX(-8deg)}}
@keyframes pw-flame{from{opacity:.7;transform:scale(1)}to{opacity:1;transform:scale(1.1)}}
@keyframes pw-breathe{50%{transform:scaleY(1.015)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><div id="app">
  <div id="world">
    <div class="sky"></div><div class="beam l"></div><div class="beam r"></div>
    <div class="crowd" id="crowd"></div>
    <div class="boards" id="boards"><div class="track"><span><b>SOCCERWIZARD</b> &middot; FREE PICKS EVERY DAY &middot; <b>SOCCERWIZARD</b>.LIVE &middot; PENALTY WAHALA &middot;</span><span><b>SOCCERWIZARD</b> &middot; FREE PICKS EVERY DAY &middot; <b>SOCCERWIZARD</b>.LIVE &middot; PENALTY WAHALA &middot;</span></div><div class="bflash" id="bflash"></div></div>
    <div class="grass" id="grass"></div>
    <svg class="layer" id="lines"></svg>
    <svg class="layer" id="net"></svg>

    <svg class="layer" id="posts"></svg>
    <div id="shadow"></div>
    <svg class="layer" id="trail"></svg>

</div>
<script>
/* PENALTY WAHALA. Spec: docs/specs/2026-10-08-penalty-wahala-design.md.
   The four rule functions below are copied verbatim from lib/penalty.js; a
   test fails if they drift. Everything else here is presentation: a small
   pseudo-3D world (metres, projected through one camera), a ball on real
   ballistics, and effects that only move transform and opacity. */
(function(){
"use strict";
var ZONES={weakBelow:0.55,overAbove:0.88};
var REG=5,BONUS=3;
var col=function(s){return s%3;},high=function(s){return s>=3;};
function strike(spot, power) {
  const kind = power > ZONES.overAbove ? "over" : power < ZONES.weakBelow ? "weak" : "green";
  return { spot, kind };
}
function neighbour(a, b) {
  if (a === b) return false;
  if (col(a) === col(b)) return true;                       // other height, same column
  return high(a) === high(b) && Math.abs(col(a) - col(b)) === 1;
}
function judge(shot, dive) {
  const s = strike(shot.spot, shot.power);
  if (s.kind === "over") return high(s.spot) ? "over" : "bar";
  if (dive === s.spot) return "save";
  if (s.kind === "weak" && neighbour(dive, s.spot)) return "save";
  return "goal";
}
/* Outcomes alternate A, B, A, B... Regulation is five each and ends early once
   the trailing side cannot catch up; then up to BONUS rounds of sudden death;
   still level after that is a draw. */
function shootout(outcomes) {
  let a = 0, b = 0;
  const n = outcomes.length;
  for (let i = 0; i < n; i++) if (outcomes[i] === "goal") { if (i % 2 === 0) a++; else b++; }
  const takenA = Math.ceil(n / 2), takenB = Math.floor(n / 2);
  const round = Math.max(takenA, 1);
  const res = (done, winner) => ({ a, b, done, winner, next: done ? null : (n % 2 === 0 ? "a" : "b"), round });
  if (takenA <= REG && takenB <= REG) {
    const leftA = REG - takenA, leftB = REG - takenB;
    if (a > b + leftB) return res(true, "a");
    if (b > a + leftA) return res(true, "b");
    if (takenA < REG || takenB < REG) return res(false, null);
    if (a !== b) return res(true, a > b ? "a" : "b");
    return res(false, null);
  }
  if (takenA !== takenB) return res(false, null);          // B still to kick this round
  if (a !== b) return res(true, a > b ? "a" : "b");
  if (takenA >= REG + BONUS) return res(true, "draw");
  return res(false, null);
}

var $=function(id){return document.getElementById(id);};
var REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
var NS="http://www.w3.org/2000/svg";
function uuid(){var b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
  var h=Array.prototype.map.call(b,function(x){return (x+256).toString(16).slice(1);}).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);}
var DEV=null,NAME=null,MUTED=false;
try{DEV=localStorage.getItem("pw.dev");if(!DEV){DEV=uuid();localStorage.setItem("pw.dev",DEV);}NAME=localStorage.getItem("pw.name");MUTED=localStorage.getItem("pw.mute")==="1";}catch(e){DEV=DEV||uuid();}

/* Every pose, by file. The first of each character and the ball are preloaded
   in <head>; the rest are fetched once the page is up. */
var SPRITES=["k-ready.webp","k-taunt.webp","k-dive-low.webp","k-dive-high.webp","k-jump.webp","k-catch.webp","k-beaten.webp","k-roar.webp","k-shrug.webp",
  "s-stand.webp","s-run.webp","s-strike.webp","s-follow.webp","s-arms.webp","s-slide.webp","s-head.webp","p-ball.webp","p-burst.webp","p-star.webp",
  "kw-ready.webp","kw-taunt.webp","kw-dive-low.webp","kw-dive-high.webp","kw-jump.webp","kw-catch.webp","kw-beaten.webp","kw-roar.webp","kw-shrug.webp",
  "sw-stand.webp","sw-run.webp","sw-strike.webp","sw-follow.webp","sw-arms.webp","sw-slide.webp","sw-head.webp"];
var IMG={};
/* TWO CHARACTERS (owner, 8 Oct 2026): Ten and The Wizard. You play as one,
   the opponent is the other, and the daily keeper is always The Wizard. Poses
   are named for Ten; file() swaps in the wizard set when he is on the pitch.
   Only the characters in play are fetched. */
var ME="ten",OPP=null;try{ME=localStorage.getItem("pw.char")==="wizard"?"wizard":"ten";}catch(e){}
function other(){return ME==="ten"?"wizard":"ten";}
var KC=other(),SC=ME;
function file(f){if(KC==="wizard"&&f.indexOf("k-")===0)return "kw-"+f.slice(2);if(SC==="wizard"&&f.indexOf("s-")===0)return "sw-"+f.slice(2);return f;}
function loadChar(c){var pre=c==="wizard"?/^(kw|sw|p)-/:/^(k|s|p)-/;SPRITES.forEach(function(f){if(pre.test(f)&&!IMG[f]){var i=new Image();i.src="/penalty/"+f;IMG[f]=i;}});}
addEventListener("load",function(){loadChar(ME);loadChar(other());});
/* How tall each pose stands in the world, in metres, so a dive and a crouch
   share one scale. */
var KH={"k-ready.webp":1.7,"k-taunt.webp":2,"k-dive-low.webp":1.05,"k-dive-high.webp":2.15,"k-jump.webp":2.45,"k-catch.webp":1.9,"k-beaten.webp":1.25,"k-roar.webp":1.95,"k-shrug.webp":1.95};

/* ---------------------------------------------------------------- camera
   World: x across (m, right +), y up, z from the penalty spot toward goal
   (goal line z=11). One pinhole camera behind and above the spot, fitted to
   the screen on every resize: the goal fills ~86% of the width, the spot
   sits at 80% of the height. */
var CAM={c:5.5,F:700,h:3,hz:200,cx:200,W:400,H:800};
function P(x,y,z){var s=CAM.F/(z+CAM.c);return {x:CAM.cx+x*s,y:CAM.hz+(CAM.h-y)*s,s:s};}
var GOAL={w:7.32,h:2.44,z:11},SPOTX=[-2.44,0,2.44];
function target(spot,kind){
  var x=SPOTX[col(spot)]*0.94,y=high(spot)?1.85:0.45;
  if(kind==="over")y=3.4;
  if(kind==="bar"){y=GOAL.h;x=SPOTX[col(spot)]*0.7;}
  return {x:x,y:y};
}
/* The kick, solved backwards from where it must cross the line: forward
   speed from power, then the launch that meets the target under gravity,
   with sideways bend from spin. */
function flightPlan(t,power,side){
  var g=9.81,vz=12+22*power,T=11/vz,ax=side*(power>0.55?3.2:1.2);
  return {vz:vz,T:T,ax:ax,vy:(t.y+0.5*g*T*T)/T,vx:(t.x-0.5*ax*T*T)/T};
}
var RESTITUTION=0.42;

function layout(){
  var a=$("app").getBoundingClientRect(),W=a.width,H=a.height;
  var goalW=Math.min(W*0.86,420),sG=goalW/GOAL.w,goalBottom=H*0.42,spotY=H*0.8;
  CAM.W=W;CAM.H=H;CAM.cx=W/2;CAM.F=sG*(GOAL.z+CAM.c);
  var s0=CAM.F/CAM.c;CAM.h=(spotY-goalBottom)/(s0-sG);CAM.hz=goalBottom-CAM.h*sG;
  var gl=P(-GOAL.w/2,GOAL.h,GOAL.z),gr=P(GOAL.w/2,0,GOAL.z),goalH=gr.y-gl.y;
  /* crowd and boards stand behind the goal */
  var bTop=gr.y-goalH*0.42,bH=Math.max(16,goalH*0.2);
  $("crowd").style.cssText="top:0;height:"+bTop+"px";
  $("boards").style.cssText="top:"+bTop+"px;height:"+bH+"px;--bf:"+Math.round(bH*0.62)+"px";
  $("grass").style.cssText="top:"+(bTop+bH)+"px;--st:"+Math.round(H*0.035)+"px";
  var z=$("zones");z.style.left=gl.x+"px";z.style.top=gl.y+"px";z.style.width=(gr.x-gl.x)+"px";z.style.height=goalH+"px";
  drawLines();drawGoal(0,0,0);

      hitStop=0.08;fx.shake(2);fx.buzz([30,30,30]);fx.sprite("burst",bp.x,bp.y,56,320);
      fx.pop("WAHALA!","#E63946");if(you)streak=0;fx.combo(streak);
    }else{fx.pop("WAHALA!","#E63946");fx.shake(0);if(you)streak=0;fx.combo(streak);}
  }
}

layout();
window.PW={RULES:{strike:strike,neighbour:neighbour,judge:judge,shootout:shootout,ZONES:ZONES,REG:REG,BONUS:BONUS},
  aimAndShoot:aimAndShoot,pickDive:pickDive,playKick:playKick,fx:fx,
  get DEV(){return DEV;},get NAME(){return NAME;},setName:function(n){NAME=n;try{localStorage.setItem("pw.name",n);}catch(e){}},
  setScore:function(a,b,who){$("scA").textContent=a;$("scB").textContent=b;if(who!=null)$("whoB").textContent=who;},
  tag:function(t){$("tag").textContent=t||"";},
  get char(){return ME;},setChar:function(c){ME=c==="wizard"?"wizard":"ten";try{localStorage.setItem("pw.char",ME);}catch(e){}loadChar(ME);SC=ME;KC=OPP||other();},
  resetStreak:function(){streak=0;fx.combo(0);},
  setOpponent:function(c){OPP=c||null;loadChar(OPP||other());KC=OPP||other();}};
})();
</script>
<script>
(function(){
"use strict";
var PW=window.PW,R=PW.RULES,REG=R.REG,BONUS=R.BONUS,$=function(id){return document.getElementById(id);};
var ORIGIN=location.origin;
window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};
function track(name,data){try{window.va("event",{name:name,data:data||{}});}catch(e){}}
function api(method,a,body,q){
  var qs="?a="+a+Object.keys(q||{}).map(function(k){return "&"+k+"="+encodeURIComponent(q[k]);}).join("");
  return fetch("/api/penalty"+qs,{method:method,headers:method==="POST"?{"Content-Type":"application/json","X-SW-Request":"1"}:{},
    body:method==="POST"?JSON.stringify(body):undefined}).then(function(r){return r.text().then(function(t){var j={};try{j=JSON.parse(t)||{};}catch(e){}
      LAST={status:r.status,error:j&&j.error};return {status:r.status,j:j};});})
    .catch(function(){LAST={status:0,error:null};return {status:0,j:{}};});
}
var LAST={status:0,error:null};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function sheet(nodes){PW.tag("");PW.fx.combo(0);var s=$("sheet");s.textContent="";nodes.forEach(function(n){s.appendChild(n);});s.classList.add("on");}
function closeSheet(){$("sheet").classList.remove("on");}
function btn(label,cls,fn){var b=el("button","btn "+cls,label);b.type="button";b.addEventListener("click",fn);return b;}
function dots(outs){var d=$("dotsYou");d.textContent="";outs.forEach(function(o){var i=el("i",o==="goal"?"g":"m");d.appendChild(i);});}

/* The one failure screen: never invents a result, and says which failure it
   was - only a dead connection is "can't reach"; a server that answered
   "not here" or "not set up" is not switched on. */
function offline(retry){
  var off=LAST.status===403||LAST.status===404||LAST.error==="not_configured";
  var msg=LAST.status===0?"Can't reach the pitch, try again.":off?"Penalty Wahala isn't switched on here yet. Play the computer meanwhile.":
    LAST.status===429?"Too many kicks for a moment. Try again shortly.":"Something went wrong on our side ("+(LAST.error||LAST.status)+"). Try again.";
  sheet([el("p",null,msg),btn("Try again","red",function(){closeSheet();retry();})]);}

function askName(){return new Promise(function(done){
  if(PW.NAME)return done(PW.NAME);
  var i=el("input","name");i.placeholder="Your name";i.maxLength=16;i.autocomplete="nickname";
  sheet([el("h2",null,"What do we call you?"),i,el("div","row"),btn("Let's go","red",function(){
    var n=i.value.replace(/[^\p{L}\p{N} ]/gu,"").replace(/\s+/g," ").trim().slice(0,16);if(!n){i.focus();return;}
    PW.setName(n);closeSheet();done(n);})]);setTimeout(function(){i.focus();},350);
});}

function shareSheet(text,url,where){
  var full=text+" "+url;
  var wa=btn("WhatsApp","red",function(){track("share",{ch:"whatsapp",where:where});open("https://wa.me/?text="+encodeURIComponent(full),"_blank");});
  var x=btn("X","red",function(){track("share",{ch:"x",where:where});open("https://x.com/intent/post?text="+encodeURIComponent(text+" via @SoccerWizardhq")+"&url="+encodeURIComponent(url),"_blank");});
  var row=el("div","row");row.appendChild(wa);row.appendChild(x);
  var row2=el("div","row");
  row2.appendChild(btn("Copy link","ghost",function(e){track("share",{ch:"copy",where:where});try{navigator.clipboard.writeText(url);e.currentTarget.textContent="Copied";}catch(_){}}));
  if(navigator.share)row2.appendChild(btn("Share","ghost",function(){track("share",{ch:"system",where:where});navigator.share({text:text,url:url}).catch(function(){});}));
  return [row,row2];
}

/* Ten or The Wizard: who you play as. The opponent is the other one. */
function charPicker(){var box=el("div","pick");
  [["ten","TEN","/penalty/k-ready.webp"],["wizard","THE WIZARD","/penalty/kw-ready.webp"]].forEach(function(c){
    var b=el("button",PW.char===c[0]?"on":"");b.type="button";var i=el("img");i.src=c[2];i.alt="";b.appendChild(i);b.appendChild(el("span",null,c[1]));
    b.addEventListener("click",function(){PW.setChar(c[0]);PW.fx.buzz(10);box.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});});box.appendChild(b);});
  return box;}
function tipsCard(){var box=el("div","tips");
  api("GET","tips").then(function(r){if(!r.j||!r.j.home)return;
    box.appendChild(el("p",null,"The wizard's real picks today"));
    box.appendChild(el("b",null,r.j.home+" v "+r.j.away));
    box.appendChild(el("p",null,r.j.tip+" · "+r.j.pct+"%"));
    var a=el("a","btn ghost","See all predictions");a.href="/";a.addEventListener("click",function(){track("tips_clicked");});box.appendChild(a);});
  return box;}

/* THE CHALLENGER: 5 shots + 3 bonus vs a computer keeper, 5 dives + 3 bonus
   vs computer shots. Judged here (no stakes); the picks go to the server. */
function challenger(){PW.setOpponent(null);PW.resetStreak();askName().then(function(name){
  var shots=[],dives=[],outs=[],i=0,cpu=0;PW.setScore(0,0,"Computer");
  function cpuDive(){return Math.floor(Math.random()*6);}
  function cpuShot(){return {spot:Math.floor(Math.random()*6),power:0.45+Math.random()*0.5};}
  var p=Promise.resolve();
  for(var i=0;i<REG+BONUS;i++)(function(n){p=p.then(function(){
    if(n===REG)PW.fx.pop("BONUS KICKS","#F2B84B");
    PW.fx.slowmo(n===REG-1);
    return PW.aimAndShoot().then(function(s){shots.push(s);var d=cpuDive(),o=R.judge(s,d);
      if(n<REG){outs.push(o);dots(outs);PW.setScore(outs.filter(function(x){return x==="goal";}).length,cpu);}
      return PW.playKick({who:"you",shot:{spot:s.spot,kind:R.strike(s.spot,s.power).kind,power:s.power},dive:d,outcome:o});})
    .then(function(){return PW.pickDive();})
    .then(function(dv){dives.push(dv);var cs=cpuShot(),co=R.judge(cs,dv);if(n<REG&&co==="goal")cpu++;return PW.playKick({who:"them",shot:R.strike(cs.spot,cs.power),dive:dv,outcome:co}).then(function(){if(n<REG)PW.setScore(outs.filter(function(x){return x==="goal";}).length,cpu);});});
  });})(i);
  p.then(function save(){PW.fx.slowmo(false);
    return api("POST","create",{name:name,device:PW.DEV,shots:shots,dives:dives}).then(function(r){
      if(r.status!==200)return offline(save);
      track("challenge_created");
      var url=ORIGIN+"/p/"+r.j.id,score=outs.filter(function(o){return o==="goal";}).length;
      sheet([el("h2",null,"You scored "+score+"/5")].concat(shareSheet("I scored "+score+"/5 on Penalty Wahala. Bet you can't save it:",url,"challenge"),[tipsCard()]));
    });});
});}

/* THE FRIEND: alternate shot then dive; the server judges and reveals only the
   shot just taken. A dropped connection resumes at the next kick. */
function friend(id){PW.setOpponent(null);PW.resetStreak();api("GET","match",null,{id:id,device:PW.DEV}).then(function(r){
  if(r.status===0)return offline(function(){friend(id);});
  if(r.status!==200)return sheet([el("h2",null,"This challenge doesn't exist"),btn("Start your own","red",function(){closeSheet();challenger();})]);
  var m=r.j;track("challenge_opened");
  if(m.expired)return sheet([el("h2",null,"This challenge ran out"),btn("Start your own","red",function(){closeSheet();challenger();})]);
  if(m.done)return result(m.score.a,m.score.b,m.winner,m.challenger,id,m.role,m.friend);
  var url=ORIGIN+"/p/"+id;
  if(m.role==="challenger")return sheet([el("h2",null,m.outcomes.length?m.friend+" is taking your challenge":"Waiting for a friend"),
    el("p",null,m.outcomes.length?"Open this link again when it's done.":"Send it to someone. The link is yours to share.")]
    .concat(shareSheet("Bet you can't beat me on Penalty Wahala:",url,"challenge"),[btn("Start another challenge","ghost",function(){closeSheet();challenger();})]));
  if(m.role!=="friend"&&m.outcomes.length)return sheet([el("h2",null,"Someone else is playing this one"),btn("Start your own","red",function(){closeSheet();challenger();})]);
  sheet([el("h2",null,m.challenger+" challenges you"),el("p",null,"5 shots, 5 saves. Free, no stakes. Pick your player:"),charPicker(),btn("Kick off","red",function(){closeSheet();askName().then(go);})]);
  var outs=m.outcomes.slice();PW.setScore(m.score.a,m.score.b,m.challenger);
  function go(name){var n=outs.length;var shot=n%2===0;
    PW.fx.slowmo(Math.floor(n/2)>=REG-1);
    var step=shot?PW.aimAndShoot().then(function(s){return api("POST","kick",{id:id,device:PW.DEV,name:name,kind:"shot",spot:s.spot,power:s.power}).then(function(x){return {x:x,s:s};});})
                 :PW.pickDive().then(function(dv){return api("POST","kick",{id:id,device:PW.DEV,name:name,kind:"dive",spot:dv}).then(function(x){return {x:x,dv:dv};});});
    step.then(function(o){var x=o.x;
      if(x.status===0)return offline(function(){go(name);});
      if(x.status===409&&x.j.error==="taken")return sheet([el("h2",null,"Someone else is playing this one"),btn("Start your own","red",function(){closeSheet();challenger();})]);
      if(x.status!==200)return offline(function(){friend(id);});
      outs.push(x.j.outcome);dots(outs.filter(function(_,i){return i%2===0;}));
      var anim=shot?PW.playKick({who:"you",shot:{spot:o.s.spot,kind:R.strike(o.s.spot,o.s.power).kind,power:o.s.power},dive:x.j.outcome==="save"?o.s.spot:(o.s.spot+3)%6,outcome:x.j.outcome})
                    :PW.playKick({who:"them",shot:x.j.against,dive:o.dv,outcome:x.j.outcome});
      anim.then(function(){var st=x.j.state;PW.setScore(st.score.a,st.score.b);if(st.done){track("challenge_finished");PW.fx.slowmo(false);return result(st.score.a,st.score.b,st.winner,m.challenger,id,"friend",name);}go(name);});
    });}
});}

/* a = the friend's goals, b = the challenger's. Told from whoever is looking:
   the friend, the challenger, or anyone else who opened the link. */
function result(a,b,winner,chName,id,role,frName){
  var url=ORIGIN+"/p/"+id,fr=frName||"Your friend",head,text;
  if(role==="friend"){head=winner==="a"?"You beat "+chName+" "+a+"-"+b:winner==="b"?chName+" beat you "+b+"-"+a:"Draw, "+a+"-"+b;
    text=winner==="a"?"I beat "+chName+" "+a+"-"+b+" on Penalty Wahala 😤 Your turn:":"Penalty Wahala: "+head+". Try me:";}
  else if(role==="challenger"){head=winner==="b"?"You beat "+fr+" "+b+"-"+a:winner==="a"?fr+" beat you "+a+"-"+b:"You drew with "+fr+", "+a+"-"+b;
    text=winner==="b"?"I beat "+fr+" "+b+"-"+a+" on Penalty Wahala 😤 Who's next?":"Penalty Wahala: "+head+". Try me:";}
  else{head=winner==="a"?fr+" beat "+chName+" "+a+"-"+b:winner==="b"?chName+" beat "+fr+" "+b+"-"+a:chName+" and "+fr+" drew "+a+"-"+b;
    text="Penalty Wahala: "+head+". Think you can do better?";}
  sheet([el("h2",null,head)].concat(shareSheet(text,url,"result"),[btn("Start your own challenge","ghost",function(){closeSheet();challenger();}),tipsCard()]));
}

window.PWFlow={challenger:challenger,friend:friend,api:api,track:track,sheet:sheet,closeSheet:closeSheet,el:el,btn:btn,shareSheet:shareSheet,tipsCard:tipsCard,offline:offline,charPicker:charPicker};
})();
</script>
<script>
(function(){
"use strict";
var PW=window.PW,F=window.PWFlow,R=PW.RULES;
function lagos(ms){return new Date(ms+3600000).toISOString().slice(0,10);}
function bumpStreak(day){var s={last:null,n:0};try{s=JSON.parse(localStorage.getItem("pw.streak")||"null")||s;}catch(e){}
  if(s.last===day)return s.n;
  var y=new Date(Date.parse(day+"T12:00:00Z")-864e5).toISOString().slice(0,10);
  s.n=s.last===y?s.n+1:1;s.last=day;try{localStorage.setItem("pw.streak",JSON.stringify(s));}catch(e){}return s.n;}

/* DAILY: shoot only, five shots, every shot judged on the server against the
   day's keeper. The day comes back with the first shot and is sent with the
   rest, so a go across Lagos midnight finishes against one keeper. */
function faced(){F.sheet([F.el("h2",null,"You've faced today's keeper"),F.el("p",null,"New keeper at midnight. Only your first go counts."),
  F.btn("Play again for fun","red",function(){F.closeSheet();forFun();}),F.btn("Challenge a friend","ghost",function(){F.closeSheet();F.challenger();})]);}
/* A replay that counts for nothing: five shots against random dives, judged
   on the phone, no server, no streak. */
function forFun(){var outs=[];PW.resetStreak();PW.setScore(0,0,"Just for fun");
  function one(){PW.aimAndShoot().then(function(s){var d=Math.floor(Math.random()*6),o=R.judge(s,d);outs.push(o);
    PW.setScore(outs.filter(function(x){return x==="goal";}).length,outs.filter(function(x){return x!=="goal";}).length);
    return PW.playKick({who:"you",shot:{spot:s.spot,kind:R.strike(s.spot,s.power).kind,power:s.power},dive:d,outcome:o});})
    .then(function(){if(outs.length<R.REG)return one();
      F.sheet([F.el("h2",null,"Just for fun: "+outs.filter(function(x){return x==="goal";}).length+"/5"),F.el("p",null,"Not counted. Tomorrow's keeper is the one that counts."),
        F.btn("Play again for fun","red",function(){F.closeSheet();forFun();}),F.btn("Challenge a friend","ghost",function(){F.closeSheet();F.challenger();})]);});}
  one();}
function daily(){var outs=[],day=null,i=0;PW.setScore(0,0,"Wizard Keeper");PW.setOpponent("wizard");PW.resetStreak();
  function sync(st){day=st.day;i=st.at;outs=st.outcomes.slice();PW.setScore(outs.filter(function(o){return o==="goal";}).length,outs.filter(function(o){return o!=="goal";}).length);}
  function start(){F.api("GET","dailystate",null,{device:PW.DEV}).then(function(r){
    if(r.status!==200)return F.offline(start);
    if(r.j.score!=null)return faced();
    sync(r.j);shot();});}
  function shot(){PW.fx.slowmo(i===R.REG-1);
    PW.aimAndShoot().then(function(s){return F.api("POST","daily",{device:PW.DEV,i:i,spot:s.spot,power:s.power,day:day}).then(function(x){return {x:x,s:s};});})
    .then(function(o){var x=o.x;
      if(x.status===409){if(x.j.score!=null)return faced();if(x.j.at!=null){sync(x.j);return shot();}return F.offline(start);}
      if(x.status!==200)return F.offline(shot);
      day=x.j.day;outs.push(x.j.outcome);PW.setScore(outs.filter(function(o){return o==="goal";}).length,outs.filter(function(o){return o!=="goal";}).length);
      return PW.playKick({who:"you",shot:{spot:o.s.spot,kind:R.strike(o.s.spot,o.s.power).kind,power:o.s.power},dive:x.j.outcome==="save"?o.s.spot:(o.s.spot+3)%6,outcome:x.j.outcome}).then(function(){
        if(!x.j.done){i++;return shot();}
        PW.fx.slowmo(false);F.track("daily_played",{score:x.j.score});
        var n=bumpStreak(day),grid=outs.map(function(o){return o==="goal"?"⚽":"❌";}).join("");
        var d=new Date(day+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
        var text="Wizard Keeper "+d+": "+grid+" "+x.j.score+"/5";
        var nodes=[F.el("h2",null,x.j.score+"/5 against the Wizard Keeper"),
          F.el("p",null,(x.j.better!=null?"Better than "+x.j.better+"% of players today. ":"")+"Streak: "+n+(n===1?" day":" days"))];
        F.sheet(nodes.concat(F.shareSheet(text,location.origin+"/penalty","daily"),[F.btn("Challenge a friend","ghost",function(){F.closeSheet();F.challenger();}),F.tipsCard()]));
      });});}
  start();}

function home(){
  var nodes=[F.el("h2",null,"Penalty Wahala"),F.el("p",null,"Free. No stakes. Just bragging rights. Pick your player:"),F.charPicker(),
    F.btn("Face today's Wizard Keeper","red",function(){F.closeSheet();daily();}),
    F.btn("Challenge a friend","ghost",function(){F.closeSheet();F.challenger();})];
  var mute=F.btn("Vibration: on","ghost",function(e){var m=localStorage.getItem("pw.mute")==="1";localStorage.setItem("pw.mute",m?"0":"1");e.currentTarget.textContent="Vibration: "+(m?"on":"off");});
  try{if(localStorage.getItem("pw.mute")==="1")mute.textContent="Vibration: off";}catch(e){}
  nodes.push(mute);
  F.sheet(nodes);
  /* "Ada beat you 4-3": finished challenges this device created in the last week. */
  F.api("GET","mine",null,{device:PW.DEV}).then(function(r){var seen={};try{seen=JSON.parse(localStorage.getItem("pw.seen")||"{}");}catch(e){}
    (r.j.results||[]).filter(function(x){return !seen[x.id]&&x.score;}).slice(0,1).forEach(function(x){
      var line=x.won?"You beat "+x.friend+" "+x.score.you+"-"+x.score.them:x.draw?"You drew with "+x.friend:x.friend+" beat you "+x.score.them+"-"+x.score.you;
      $note(line);seen[x.id]=1;try{localStorage.setItem("pw.seen",JSON.stringify(seen));}catch(e){}});});
  function $note(t){var s=document.getElementById("sheet");s.insertBefore(F.el("p","note",t),s.firstChild);}
}

var c=new URLSearchParams(location.search).get("c");
if(c&&/^[A-Za-z0-9]{6}$/.test(c))F.friend(c.toUpperCase());else home();
})();
</script>
