# The daily social drop on Telegram (data/promo-queue.json; X + Instagram are
# scheduled in Buffer). EVERY HOUR AT :17 (owner, 17 Oct 2026): runs pinned to
# :00 and :30 were skipped by GitHub's busy scheduler - the 12:30 drop never ran.
# The script posts only what is due today and not yet in data/promo-log.json, so
# a skipped run is caught by the next one and nothing posts twice.
name: Promo drop
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post what is due
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node scripts/promodrop.js
          if [ -z "$(git status --porcelain -- data/promo-log.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/promo-log.json
          git commit -m "Promo drop log $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
