<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 92" width="80" height="92">
<!-- Admin crest (owner, 19 Oct 2026: "i dont see a badge for me the admin"): the same shield in
     platinum, the Wizard's crown, and a slow light sweeping across it; still for anyone who asks
     for reduced motion. -->
<style>
.sweep{animation:sweep 5s ease-in-out infinite}
.gem{animation:gem 2.8s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-90px)}85%,100%{transform:translateX(90px)}}
@keyframes gem{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none;opacity:0}.gem{animation:none;opacity:.85}}
</style>
<defs>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f3a"/><stop offset="1" stop-color="#11141a"/></linearGradient>
<linearGradient id="pt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d9dde5"/><stop offset="1" stop-color="#9aa1ad"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><path d="M40 3 74 14v30c0 22-15 37-34 45C21 81 6 66 6 44V14Z"/></clipPath>
<filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<path d="M40 3 74 14v30c0 22-15 37-34 45C21 81 6 66 6 44V14Z" fill="url(#sh)" stroke="url(#pt)" stroke-width="2.5"/>
<path d="M40 10 67 19v25c0 18-12 30-27 37C25 74 13 62 13 44V19Z" fill="none" stroke="#E9ECF2" stroke-opacity=".22"/>
<path d="M21 56 18 32 30 42 40 26 50 42 62 32 59 56Z" fill="url(#pt)"/>
<rect x="20" y="58" width="40" height="7" rx="2" fill="url(#pt)"/>
<circle cx="18" cy="30" r="3" fill="url(#pt)"/><circle cx="40" cy="23.5" r="3.4" fill="url(#pt)"/><circle cx="62" cy="30" r="3" fill="url(#pt)"/>
<circle class="gem" cx="40" cy="47" r="5" fill="#9ad8ff" filter="url(#gl)"/>
<circle cx="40" cy="47" r="3.6" fill="#e8f6ff"/>
<g clip-path="url(#cl)"><rect class="sweep" x="0" y="0" width="34" height="92" fill="url(#sw)" transform="translate(-90 0)"/></g>
</svg>
