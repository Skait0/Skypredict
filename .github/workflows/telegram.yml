# Telegram channel, on demand, without the mint run.
#   - no input: send any daily post that is due (the daily run does the same)
#   - pin_text: post that text and pin it in place of the current pin
name: Telegram posts
on:
  workflow_dispatch:
    inputs:
      pin_text:
        description: "Text to post and pin (leave empty to send due posts)"
        required: false
        default: ""
      keep_pin:
        description: "With pin_text: pin beside the current pin instead of replacing it"
        type: boolean
        default: false
      set_webhook:
        description: "Point the bot at /api/tg (code doctor)"
        type: boolean
        default: false
      post_text:
        description: "Text to post to the channel without pinning (an announcement)"
        required: false
        default: ""
      photos:
        description: "Comma-separated public image URLs to post as an album with post_text as caption"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Webhook
        if: ${{ inputs.set_webhook }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/tgwebhook.js
      - name: Pin
        if: ${{ inputs.pin_text != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_PIN_TEXT: ${{ inputs.pin_text }}
          TG_KEEP_PIN: ${{ inputs.keep_pin && '1' || '0' }}
        run: node scripts/tgpin.js
      - name: Announce
        if: ${{ inputs.post_text != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_PIN_TEXT: ${{ inputs.post_text }}
          TG_PHOTOS: ${{ inputs.photos }}
          TG_PIN: "0"
        run: node scripts/tgpin.js
      - name: Send
        if: ${{ inputs.pin_text == '' && inputs.post_text == '' && !inputs.set_webhook }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node scripts/tgpost.js
          if [ -z "$(git status --porcelain -- data/tg-posts.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tg-posts.json
          git commit -m "Telegram posts for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
