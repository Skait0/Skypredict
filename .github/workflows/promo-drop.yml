# The daily social drop on Telegram (data/promo-queue.json; X + Instagram are
# scheduled in Buffer). 11:30 and 18:00 UTC = 12:30 and 19:00 Lagos. GitHub's
# scheduler can run late; the script posts whatever is due and not yet logged.
name: Promo drop
on:
  schedule:
    - cron: "30 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Post what is due
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node scripts/promodrop.js
          if [ -z "$(git status --porcelain -- data/promo-log.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/promo-log.json
          git commit -m "Promo drop log $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
