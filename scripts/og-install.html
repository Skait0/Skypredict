<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#F2F1F0;
  background:
    radial-gradient(600px 420px at 300px 330px, rgba(230,57,70,.22), transparent 70%),
    radial-gradient(520px 360px at 980px 120px, rgba(242,184,75,.10), transparent 70%),
    #0D0D0F;position:relative}
.topline{position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#F2B84B 30%,#F2B84B 70%,transparent)}
/* the phone */
.phone{position:absolute;left:118px;top:58px;width:300px;height:560px;border-radius:44px;
  background:#16161a;border:2px solid #2d2d34;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 7px #0b0b0d}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:92px;height:24px;border-radius:14px;background:#0b0b0d}
.screen{position:absolute;inset:14px;border-radius:32px;overflow:hidden;
  background:linear-gradient(170deg,#23202b 0%,#1a1720 55%,#131217 100%)}
.clock{position:absolute;top:44px;width:100%;text-align:center;font-weight:700;font-size:44px;letter-spacing:-.02em;color:#fff}
.date{position:absolute;top:100px;width:100%;text-align:center;font-weight:600;font-size:14px;color:#b9b5c0}
.grid{position:absolute;left:18px;right:18px;top:160px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px}
.ic{width:48px;height:48px;border-radius:14px;background:#2c2934}
.ic.a{background:#34313d}.ic.b{background:#2a3340}.ic.c{background:#3a2e33}.ic.d{background:#2f3a31}
.lb{width:38px;height:6px;border-radius:3px;background:#3a3742}
.hero{position:relative}
.hero .ic{width:48px;height:48px;background:#0D0D0F url('file:///C:/Users/DELL/Desktop/Skypredict/public/icon-192.png') center/88% no-repeat;
  box-shadow:0 0 0 3px #F2B84B,0 0 26px 6px rgba(242,184,75,.55)}
.hero .name{font-size:10.5px;font-weight:700;color:#fff}
.tap{position:absolute;top:-8px;left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;
  border:2px solid rgba(242,184,75,.55)}
.dock{position:absolute;left:22px;right:22px;bottom:22px;height:72px;border-radius:24px;background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:space-around}
.dock .ic{width:46px;height:46px;border-radius:13px}
/* the words */
.copy{position:absolute;left:500px;top:92px;right:70px}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:38px;letter-spacing:-.02em}
.brand img{width:62px;height:62px}
.brand .w{color:#E63946}
h1{margin-top:34px;font-size:64px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
h1 em{font-style:normal;color:#F2B84B}
.steps{margin-top:30px;display:flex;gap:10px}
.st{display:flex;align-items:center;gap:9px;padding:10px 14px 10px 10px;border-radius:14px;
  background:#1a1a1f;border:1px solid #2b2b32;font-weight:700;font-size:17px;color:#e9e7ea}
.st b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#2a2320;color:#F2B84B;font-size:15px}
.sub{margin-top:26px;font-size:21px;font-weight:600;color:#A3A0A6}
.sub span{color:#2FD48A}
.foot{position:absolute;left:500px;right:70px;bottom:44px;display:flex;justify-content:space-between;
  font-size:19px;font-weight:600;color:#8d8993}
.foot b{color:#F2F1F0;font-weight:700}
</style></head><body>
<div class="topline"></div>
<div class="phone"><div class="screen">
  <div class="clock">9:41</div><div class="date">Tuesday, 29 September</div>
  <div class="grid">
    <div class="app"><div class="ic a"></div><div class="lb"></div></div>
    <div class="app"><div class="ic b"></div><div class="lb"></div></div>
    <div class="app"><div class="ic c"></div><div class="lb"></div></div>
    <div class="app"><div class="ic d"></div><div class="lb"></div></div>
    <div class="app"><div class="ic c"></div><div class="lb"></div></div>
    <div class="app hero"><div class="tap"></div><div class="ic"></div><div class="name">Soccerwizard</div></div>
    <div class="app"><div class="ic a"></div><div class="lb"></div></div>
    <div class="app"><div class="ic b"></div><div class="lb"></div></div>
    <div class="app"><div class="ic d"></div><div class="lb"></div></div>
    <div class="app"><div class="ic a"></div><div class="lb"></div></div>
    <div class="app"><div class="ic b"></div><div class="lb"></div></div>
    <div class="app"><div class="ic c"></div><div class="lb"></div></div>
  </div>
  <div class="dock"><div class="ic a"></div><div class="ic b"></div><div class="ic c"></div><div class="ic d"></div></div>
</div><div class="notch"></div></div>
<div class="copy">
  <div class="brand"><img src="file:///C:/Users/DELL/Desktop/Skypredict/public/icon-192.png" alt=""><span>Soccer<span class="w">wizard</span></span></div>
  <h1>On your home screen<br>in <em>3 taps</em></h1>
  <div class="steps">
    <div class="st"><b>1</b>Menu</div>
    <div class="st"><b>2</b>Add to Home screen</div>
    <div class="st"><b>3</b>Done</div>
  </div>
  <p class="sub"><span>Free</span> · No Play Store · Under 1 MB</p>
</div>
<div class="foot"><span><b>soccerwizard.live</b>/install</span><span>18+</span></div>
</body></html>
