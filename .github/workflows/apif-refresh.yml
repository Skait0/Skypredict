# Refresh the current season from API-Football while a paid plan is active.
#
# The owner keeps the paid plan (25 Sep 2026: "we are no longer on the free
# plan"), so this no longer stops on a date. It asks API-Football's /status -
# which does not count against the allowance - and runs whenever the plan is
# active with a paid-size daily limit. If the plan ever lapses to free (100 a
# day, seasons up to 2024), the 2026 season would be refused, so it skips.
#
# About 630 requests a run: 81 league-seasons plus statistics for the season's
# finished fixtures, twenty a request. There is no tmp/apif cache on a runner,
# so each run asks afresh - which is what a current season needs. The script
# stops at 15 left on the day, below the build oracle's own floor.
name: Refresh the current season from API-Football

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC, after the weekend's games
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Only while a paid plan is active
        id: plan
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          s=$(curl -s -H "x-apisports-key: $APISPORTS_KEY" https://v3.football.api-sports.io/status)
          active=$(echo "$s" | jq -r '.response.subscription.active // false')
          limit=$(echo "$s" | jq -r '.response.requests.limit_day // 0')
          echo "plan: $(echo "$s" | jq -r '.response.subscription.plan // "?"') active=$active limit_day=$limit"
          if [ "$active" = "true" ] && [ "$limit" -gt 100 ]; then
            echo "live=1" >> "$GITHUB_OUTPUT"
          else
            echo "no paid API-Football plan active - nothing to refresh"
            echo "live=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.plan.outputs.live == '1'
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.live == '1'
        with:
          node-version: "20"
      - name: Harvested leagues, with statistics
        if: steps.plan.outputs.live == '1'
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/apifbackfill.js --seasons=2026 --stats --gap=300
      - name: Statistics overlay for the extra top flights
        if: steps.plan.outputs.live == '1'
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: node scripts/apifbackfill.js --overlay --seasons=2026 --stats --gap=300
      - name: Commit, if anything changed
        if: steps.plan.outputs.live == '1'
        run: |
          if git diff --quiet -- data/results; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results
          git commit -m "Refresh the current season from API-Football"
          git push
