name: Mint the day's booking code

# One slip a day, booked on both bookmakers, committed so every build after it
# can print the code without booking anything itself.
#
# WHY IT IS NOT IN THE BUILD. api/book.js is explicit about what a booking call
# costs: Railway CPU on a $5 plan, and bookmaker goodwill that has been spent
# once already. The site builds five or six times a day off the sweep hook, so
# minting there would be eighteen booking calls to publish one code.
#
# IT ASKS FOR 06:00 UTC AND GITHUB DELIVERS IT AT MIDDAY. Measured over the
# week to 15 Sep, every run late and none of them close: 10:52, 10:57, 10:54,
# 10:51, 10:19, 11:19, 12:12 - between four and six hours behind the cron. That
# is free-tier scheduling, not a misconfiguration, and the paragraph that used
# to sit here said "07:00 in Lagos, before the 06:30 build" as though the
# number in the cron were a promise.
#
# What is actually true: the code is minted around midday UTC, so a reader
# looking for it at breakfast in Lagos finds yesterday's until roughly 12:00
# local. Nothing breaks - mkcode.js refuses any fixture inside fifteen minutes
# of kick-off, so a late run picks later games rather than dead ones - and the
# build that follows carries the code from then on.
#
# The cron is LEFT AT 06:00 on purpose. Moving it earlier to compensate is a
# guess about somebody else's queue: the delay is theirs to vary, and a 03:00
# cron that lands at 09:00 today can land at 05:00 tomorrow. If the morning
# actually matters, the fix is an external trigger - a scheduler outside GitHub
# calling workflow_dispatch - not a number chosen to cancel out a queue.
#
# Needs no secrets. It books through the public route, the same one the site
# uses, and writes to the repository - which is why the job asks for
# `contents: write`.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      legs:
        description: "How many games in the slip"
        type: string
        default: "5"
      date:
        description: "Which day (YYYY-MM-DD). Blank means today in Lagos."
        type: string
        default: ""

permissions:
  contents: write

jobs:
  # Can each book still take a slip at all? Beside the mint rather than in
  # front of it - it reports, it does not gate. canary.yml owns that reasoning,
  # along with why it no longer carries a schedule of its own: it asked for
  # 05:30 and GitHub fired it zero times.
  # AFTER the mint, not beside it (13 Oct 2026): run together, the mint was
  # pulling ~1,300 BetKing events through the booking upstream at the very
  # moment the canary booked, and BetKing answered the canary 502 four days
  # running, while the same canary on its own passed. always(): it still
  # reports when the mint fails.
  canary:
    needs: mint
    if: ${{ always() }}
    uses: ./.github/workflows/canary.yml
    secrets: inherit   # SW_BOT_DEVICE, the exempt id the canary books with

  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # REBUILD THE BOARD BEFORE READING IT.
      #
      # mkcode reads the LIVE predictions.json, and the board is baked at
      # deploy - so what it reads is as old as the last deploy. Deploys are
      # driven by commits and by the sweep's hook, and on 23 Sep neither fired:
      # the mint threw on a one-fixture Tuesday, its non-zero exit committed
      # nothing, and the board sat twenty hours stale while both day-locked
      # cards moved on to games nobody had been shown.
      #
      # So the day starts with a deploy, whatever else happens afterwards. It
      # costs one build a day, it uses the hook the sweep already holds, and it
      # is the only scheduled rebuild that does not depend on something else
      # having changed first.
      #
      # Never fatal: a stale board still mints a usable code, and failing here
      # would cost the day its code for the sake of its freshness.
      - name: Rebuild the board first
        continue-on-error: true
        env:
          REBUILD_HOOK: ${{ secrets.REBUILD_HOOK }}
        run: |
          if [ -z "$REBUILD_HOOK" ]; then
            echo "REBUILD_HOOK is not set - minting off whatever the last deploy baked."
            exit 0
          fi
          code=$(curl -sS -X POST -o hook.json -w '%{http_code}' --max-time 30 "$REBUILD_HOOK")
          echo "deploy hook: HTTP $code"
          cat hook.json 2>/dev/null || true
          echo
          # Long enough for a build that takes about 50 seconds, plus room.
          sleep 150
          curl -sS "https://www.soccerwizard.live/predictions.json" \
            | head -c 400 | tr ',' '\n' | grep -i '"generated' || true

      # A refusal is not a failure - the script drops the legs the bookmaker
      # will not take and rebuilds the slip, up to four rounds. What it will not
      # do is publish two codes for two different slips, so if it exits non-zero
      # the right answer is no code today rather than a code we cannot stand
      # behind tomorrow.
      - name: Mint
        env:
          SW_BOT_DEVICE: ${{ secrets.SW_BOT_DEVICE }}
        run: |
          node scripts/mkcode.js \
            --legs=${{ inputs.legs || '5' }} \
            ${{ inputs.date && format('--date={0}', inputs.date) || '' }}

      - name: Commit, if a code was minted
        id: commit
        run: |
          if git diff --quiet -- data/daily-codes.json; then
            echo "no new code - leaving the file as it is"
            echo "minted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-codes.json
          git commit -m "Booking code for $(date -u +%Y-%m-%d)"
          # The job takes minutes and anything else pushing to main in that
          # window rejects this push - which throws away a code that has
          # already been booked at four bookmakers and cannot be re-minted
          # without booking it again. Rebase and retry; the file is a map keyed
          # by date, so a concurrent change to another day merges cleanly.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push rejected - retrying ($i/3)"
            sleep 5
          done
          echo "minted=true" >> "$GITHUB_OUTPUT"

      # Wait for Vercel to serve the new code, so the link in the X posts below
      # works when they go out. Reader pushes no longer ride this workflow: the
      # 9am pick of the day is sent by Vercel cron (api/push.js?a=morning).
      - name: Wait for the deploy
        if: steps.commit.outputs.minted == 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          D=$(node -p 'Object.keys(require("./data/daily-codes.json")).sort().pop()')
          for i in $(seq 1 40); do
            curl -fs "https://www.soccerwizard.live/code-today.json?t=$i" | grep -q "\"date\":\"$D\"" && exit 0
            sleep 15
          done
          echo "the site is not serving $D yet"

      # The day's posts for @SoccerWizardhq, queued in Buffer (free plan; X's
      # own API charges per post). After the wait on purpose: that step
      # waits for Vercel to serve the new code, so the link in the post works
      # when it goes out. Runs on a day with no new code too - yesterday's
      # result still wants posting. data/x-posts.json is the record that stops
      # a rerun posting twice, so it is committed like the codes are.
      - name: Queue the X posts
        continue-on-error: true
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
        run: |
          node scripts/xqueue.js
          if [ -z "$(git status --porcelain -- data/x-posts.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-posts.json
          git commit -m "X posts for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push rejected - retrying ($i/3)"
            sleep 5
          done

      # The same two posts to the Telegram channel, sent by the bot (Telegram
      # has no queue, so they go now). data/tg-posts.json stops a rerun sending
      # twice. See scripts/tgpost.js.
      - name: Send the Telegram posts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node scripts/tgpost.js
          if [ -z "$(git status --porcelain -- data/tg-posts.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tg-posts.json
          git commit -m "Telegram posts for $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push rejected - retrying ($i/3)"
            sleep 5
          done
