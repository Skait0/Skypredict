<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soccerwizard ad unit — wizard portrait 1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 1080x1080 ad unit, same art direction as the 1500x500 header so the
     profile and the paid posts read as one campaign.
     The square inverts the header's arrangement: the face takes the top two
     thirds, the words sit under it on solid ground. A 3:1 banner can put type
     beside a portrait; a square cannot without crowding both.
     Text stays well under the 20% area ad platforms penalise. */
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#17171a}
  .banner{width:1080px;height:1080px;position:relative;overflow:hidden;background:#0D0D0F;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F2F1F0}
  .art{position:absolute;top:0;left:0;right:0;height:660px;
    background-image:url('../../../public/intro-wizard-poster.jpg');
    background-size:cover;background-position:52% 26%}
  /* The fade has to finish before the type starts, or the words sit on the
     beard. It runs the last 260px of the picture. */
  .fade{position:absolute;left:0;right:0;top:360px;height:300px;
    background:linear-gradient(180deg,rgba(13,13,15,0),rgba(13,13,15,.72) 55%,#0D0D0F 100%)}
  .in{position:absolute;left:72px;right:72px;top:596px;
    display:flex;flex-direction:column;gap:20px}
  .eyebrow{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:#F2B84B}
  .eyebrow i{width:9px;height:9px;border-radius:50%;background:#E63946;font-style:normal}
  h1{font-size:64px;line-height:1.04;font-weight:800;letter-spacing:-.032em}
  h1 em{font-style:normal;color:#E63946}
  .sub{font-size:25px;font-weight:500;color:#B5B2BA;line-height:1.4;max-width:34ch}
  .foot{position:absolute;left:72px;right:72px;bottom:66px;
    display:flex;align-items:center;justify-content:space-between;
    padding-top:26px;border-top:1px solid #2A2A30}
  .mark{display:flex;align-items:center;gap:14px;font-size:29px;font-weight:800;letter-spacing:-.02em}
  .mark span{color:#E63946}
  .mark img{height:52px;width:auto;display:block}
  .books{font-size:19px;font-weight:600;color:#8A868F;text-align:right}
</style>
</head>
<body>
  <div class="banner">
    <div class="art"></div>
    <div class="fade"></div>
    <div class="in">
      <div class="eyebrow"><i></i>soccerwizard.live</div>
      <h1>We build the slip.<br>You get the<br><em>booking code</em>.</h1>
      <p class="sub">Every game priced. Every tip checked against the score.</p>
    </div>
    <div class="foot">
      <div class="mark"><img src="../../../public/wiz-logo.png" alt="">Soccer<span>wizard</span></div>
      <div class="books">SportyBet &middot; Bet9ja<br>football.com</div>
    </div>
  </div>
</body>
</html>
